# Bygger engelska och tyska sidor och publicerar sajten på GitHub Pages.
#
# Engångsinställning: Settings → Pages → Source: "GitHub Actions"
name: Publicera sajten

on:
  push:
    branches: [main]
  workflow_dispatch: # går att köra manuellt under fliken Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bygg engelska och tyska sidor
        run: |
          npm ci
          npm run build
          rm -rf node_modules


      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
